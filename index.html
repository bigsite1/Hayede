<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آهنگ بانو هایده</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #0f0524 100%);
        font-family: Tahoma, 'Segoe UI', sans-serif;
        overflow: hidden;
        position: relative;
    }

    /* ستاره‌های پس‌زمینه */
    body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
            radial-gradient(2px 2px at 20% 30%, rgba(255, 215, 150, 0.8), transparent),
            radial-gradient(2px 2px at 80% 20%, rgba(255, 215, 150, 0.6), transparent),
            radial-gradient(1px 1px at 40% 70%, rgba(255, 255, 255, 0.7), transparent),
            radial-gradient(1px 1px at 90% 80%, rgba(255, 215, 150, 0.5), transparent),
            radial-gradient(2px 2px at 10% 90%, rgba(255, 255, 255, 0.6), transparent),
            radial-gradient(1px 1px at 60% 10%, rgba(255, 215, 150, 0.7), transparent),
            radial-gradient(1px 1px at 75% 55%, rgba(255, 255, 255, 0.5), transparent);
        animation: twinkle 4s infinite alternate;
    }

    @keyframes twinkle {
        from { opacity: 0.5; }
        to { opacity: 1; }
    }

    .card {
        position: relative;
        background: rgba(30, 15, 50, 0.85);
        backdrop-filter: blur(20px);
        border-radius: 30px;
        padding: 50px 45px 40px;
        box-shadow: 
            0 25px 60px rgba(0, 0, 0, 0.6),
            0 0 80px rgba(180, 100, 255, 0.15),
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 200, 255, 0.15);
        text-align: center;
        max-width: 420px;
        width: 90%;
        animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* قاب عکس با هاله نورانی */
    .portrait-wrapper {
        position: relative;
        width: 180px;
        height: 180px;
        margin: 0 auto 30px;
    }

    .portrait-wrapper::before {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        background: conic-gradient(
            from 0deg,
            #ffd89b, #c86dd7, #ffd89b, #c86dd7, #ffd89b
        );
        animation: rotateGlow 6s linear infinite;
        filter: blur(6px);
        opacity: 0.8;
    }

    @keyframes rotateGlow {
        to { transform: rotate(360deg); }
    }

    .portrait {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #1a0a2e;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        background: linear-gradient(135deg, #4a2c6e, #1a0a2e);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* اگر عکس نبود، آیکون جایگزین */
    .portrait-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 70px;
        color: rgba(255, 215, 150, 0.4);
        z-index: 1;
    }

    .portrait img {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
    }

    h1 {
        color: #ffd89b;
        font-size: 26px;
        margin-bottom: 8px;
        text-shadow: 0 0 20px rgba(255, 216, 155, 0.4);
        letter-spacing: 1px;
    }

    .subtitle {
        color: rgba(220, 190, 255, 0.7);
        font-size: 14px;
        margin-bottom: 35px;
        letter-spacing: 0.5px;
    }

    /* دکمه پخش */
    .play-btn {
        position: relative;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        background: linear-gradient(145deg, #ffd89b, #e8a87c);
        box-shadow: 
            0 10px 30px rgba(255, 180, 120, 0.4),
            0 0 0 0 rgba(255, 216, 155, 0.6),
            inset 0 2px 4px rgba(255, 255, 255, 0.5),
            inset 0 -4px 8px rgba(180, 100, 50, 0.3);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
    }

    .play-btn:hover {
        transform: scale(1.08);
        box-shadow: 
            0 15px 40px rgba(255, 180, 120, 0.6),
            0 0 0 12px rgba(255, 216, 155, 0.15),
            inset 0 2px 4px rgba(255, 255, 255, 0.5),
            inset 0 -4px 8px rgba(180, 100, 50, 0.3);
    }

    .play-btn:active {
        transform: scale(0.95);
    }

    .play-btn.playing {
        background: linear-gradient(145deg, #c86dd7, #8b3fa8);
        box-shadow: 
            0 10px 30px rgba(200, 109, 215, 0.5),
            0 0 0 0 rgba(200, 109, 215, 0.6),
            inset 0 2px 4px rgba(255, 255, 255, 0.3),
            inset 0 -4px 8px rgba(80, 20, 100, 0.4);
    }

    .play-btn svg {
        width: 36px;
        height: 36px;
        fill: #2d1b4e;
        transition: all 0.3s ease;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
    }

    .play-btn.playing svg {
        fill: #fff;
    }

    /* امواج صوتی هنگام پخش */
    .waves {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(255, 216, 155, 0.6);
        opacity: 0;
        pointer-events: none;
    }

    .play-btn.playing .waves {
        animation: wavePulse 1.8s ease-out infinite;
    }

    .play-btn.playing .waves:nth-child(2) {
        animation-delay: 0.6s;
    }

    .play-btn.playing .waves:nth-child(3) {
        animation-delay: 1.2s;
    }

    @keyframes wavePulse {
        0% {
            transform: scale(1);
            opacity: 0.8;
        }
        100% {
            transform: scale(2);
            opacity: 0;
        }
    }

    /* نوار پیشرفت */
    .progress-container {
        margin-top: 30px;
        width: 100%;
    }

    .progress-bar {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ffd89b, #c86dd7);
        border-radius: 10px;
        transition: width 0.1s linear;
        box-shadow: 0 0 10px rgba(255, 216, 155, 0.5);
    }

    .time-display {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        font-size: 12px;
        color: rgba(220, 190, 255, 0.6);
        font-family: monospace;
        direction: ltr;
    }

    /* بخش راهنما برای آدرس آهنگ */
    .hint {
        margin-top: 35px;
        padding: 15px 20px;
        background: rgba(255, 200, 255, 0.05);
        border: 1px dashed rgba(255, 200, 255, 0.25);
        border-radius: 12px;
        font-size: 12px;
        color: rgba(220, 190, 255, 0.65);
        line-height: 1.8;
        text-align: right;
    }

    .hint code {
        background: rgba(255, 216, 155, 0.15);
        color: #ffd89b;
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 11px;
        direction: ltr;
        display: inline-block;
        margin-top: 4px;
    }

    .hint strong {
        color: #ffd89b;
        font-weight: 600;
    }

    /* ریسپانسیو */
    @media (max-width: 480px) {
        .card {
            padding: 35px 25px 30px;
        }
        .portrait-wrapper {
            width: 150px;
            height: 150px;
        }
        h1 {
            font-size: 22px;
        }
        .play-btn {
            width: 78px;
            height: 78px;
        }
    }
</style>
</head>
<body>

<div class="card">
    <!-- قاب عکس بانو هایده -->
    <div class="portrait-wrapper">
        <div class="portrait">
            <div class="portrait-placeholder">🎵</div>
            <!--
                ⬇️ برای قرار دادن عکس بانو هایده، آدرس عکس را در src زیر وارد کنید ⬇️
            -->
            <img src="1.png" alt="بانو هایده"
                 onerror="this.style.display='none'">
        </div>
    </div>

    <h1>بانو هایده</h1>
    <p class="subtitle">صدای جاودان موسیقی ایرانی</p>

    <!-- دکمه پخش -->
    <button class="play-btn" id="playBtn" aria-label="پخش آهنگ">
        <span class="waves"></span>
        <span class="waves"></span>
        <span class="waves"></span>
        <svg id="playIcon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </button>

    <!-- نوار پیشرفت -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>

    <!-- راهنمای آدرس آهنگ -->

    <!-- 
        ⬇️⬇️⬇️ آدرس آهنگ را در src زیر وارد کنید ⬇️⬇️⬇️
        می‌توانید از فایل محلی (مثل music.mp3) یا لینک اینترنتی استفاده کنید.
    -->
    <audio id="audioPlayer" src="1.mp3"></audio>
</div>

<script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    // آیکون پخش و توقف
    const playPath = 'M8 5v14l11-7z';
    const pausePath = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

    // فرمت زمان
    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // پخش/توقف
    playBtn.addEventListener('click', () => {
        if (!audio.src || audio.src === window.location.href) {
            alert('⚠️ لطفاً ابتدا آدرس آهنگ را در کد HTML وارد کنید.\n\nدر تگ <audio> مقدار src را تنظیم کنید.');
            return;
        }
        if (audio.paused) {
            audio.play().catch(err => {
                alert('خطا در پخش آهنگ: ' + err.message);
            });
        } else {
            audio.pause();
        }
    });

    audio.addEventListener('play', () => {
        playBtn.classList.add('playing');
        playIcon.innerHTML = `<path d="${pausePath}"/>`;
    });

    audio.addEventListener('pause', () => {
        playBtn.classList.remove('playing');
        playIcon.innerHTML = `<path d="${playPath}"/>`;
    });

    audio.addEventListener('ended', () => {
        playBtn.classList.remove('playing');
        playIcon.innerHTML = `<path d="${playPath}"/>`;
        progressFill.style.width = '0%';
        currentTimeEl.textContent = '0:00';
    });

    // به‌روزرسانی نوار پیشرفت
    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
        }
    });

    audio.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audio.duration);
    });

    // کلیک روی نوار پیشرفت برای جابه‌جایی
    progressBar.addEventListener('click', (e) => {
        if (!audio.duration) return;
        const rect = progressBar.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const percent = clickX / rect.width;
        audio.currentTime = percent * audio.duration;
    });
</script>

</body>
</html>
